<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>

*{box-sizing:border-box}
body{margin:0;overflow-x:hidden;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#0b1020;color:#e8ecff}
.note-top{padding:10px 18px;font-size:12px;color:#8e9bc4;border-bottom:1px solid #1c2747}
.grades{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch;padding:14px 18px 0}
.g{background:#14203f;border:1px solid #23345e;border-radius:10px;padding:7px 12px;text-align:center;min-width:78px}
.g b{display:block;font-size:20px}.g span{font-size:11px;color:#8e9bc4}
.gA b{color:#38d39f}.gB b{color:#9be27a}.gC b{color:#ffd166}.gD b{color:#ff9f5a}.gE b{color:#ff5c7a}
.proj{margin-left:auto;background:linear-gradient(135deg,#2a3f7a,#1a2850);border:1px solid #34509a;border-radius:10px;padding:7px 16px;text-align:right}
.proj b{font-size:22px}.proj span{display:block;font-size:11px;color:#9fb0de}
.wrap{display:flex;gap:18px;padding:14px 18px 18px;align-items:flex-start}
.pitch{flex:2;min-width:0;border-radius:14px;padding:14px 8px;background:radial-gradient(ellipse at center,#14264a 0%,#0b1530 70%);border:1px solid #23345e}
.row{display:flex;justify-content:center;gap:10px;margin:12px 0;flex-wrap:wrap}
.p{width:100px;background:linear-gradient(160deg,#1d2b52,#121b36);border:1px solid #2c3f73;border-top:4px solid var(--club);border-radius:12px;padding:7px 6px 8px;text-align:center;cursor:pointer;position:relative;transition:transform .12s}
.p:hover{transform:translateY(-3px)}
.p.sel{box-shadow:0 0 0 3px #ffd400}
.p.sell{border-color:#ff5c7a;border-top-color:var(--club);box-shadow:0 0 0 2px #ff5c7a}
.p.sell.sel{box-shadow:0 0 0 2px #ff5c7a,0 0 0 5px #ffd400}
.selltag{position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:#ff5c7a;color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:9px;white-space:nowrap}
.pos{font-size:9px;letter-spacing:.1em;color:#8e9bc4}
.av{width:40px;height:40px;border-radius:50%;margin:3px auto 4px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;border:2px solid rgba(255,255,255,.25)}
.nm{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xp{font-size:20px;font-weight:800;margin-top:1px}.xp small{font-size:10px;font-weight:500;opacity:.6}
.opp{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:5px;margin-top:3px;color:#111}
.bar{height:4px;border-radius:2px;background:#2a3a66;margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;background:#38d39f}
.dc{font-size:9px;color:#8e9bc4;margin-top:2px}
.bench{border-top:1px dashed #2c3f73;margin-top:16px;padding-top:6px}.bench .lbl{text-align:center;font-size:11px;letter-spacing:.12em;color:#8e9bc4}
.d2{background:#01fc7a}.d3{background:#e7e7e7}.d4{background:#ff1751;color:#fff!important}.d5{background:#80072d;color:#fff!important}
.panel{flex:1;min-width:290px;max-width:390px;border-radius:14px;padding:18px;background:rgba(25,38,75,.92);border:1px solid #2c3f73;position:sticky;top:12px}
.panel h2{margin:0;font-size:20px}.meta{font-size:13px;color:#9fb0de;margin:2px 0 12px}
.close{display:none;position:absolute;right:14px;top:12px;background:none;border:none;color:#9fb0de;font-size:22px;cursor:pointer}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.kp div{border-radius:10px;padding:8px;text-align:center;background:rgba(127,140,200,.13)}.kp b{display:block;font-size:18px}.kp span{font-size:11px;color:#9fb0de}
.sec{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#8e9bc4;margin:12px 0 6px}
.fx{display:flex;gap:6px}.fx div{flex:1;border-radius:6px;padding:6px 2px;text-align:center;font-size:12px;font-weight:600;color:#111}
.sb{display:flex;align-items:center;gap:8px;font-size:13px;margin:5px 0}.sb .t{width:96px}.sb .b{flex:1;height:8px;border-radius:4px;background:rgba(127,140,200,.2);overflow:hidden}.sb .b i{display:block;height:100%;background:#7b5cff}.sb .v{width:44px;text-align:right}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:10px 0 4px}
.s1{background:#5b6ea8}.s2{background:#ff9f5a}.s3{background:#38d39f}.s4{background:#7b5cff}
.bonuswarn{background:#3a2a05;border:1px solid #ffb000;color:#ffd166;border-radius:8px;padding:6px 9px;margin:8px 0 2px;font-size:12px;font-weight:600}
.brow{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:start;padding:7px 0;border-bottom:1px solid #22325c}
.brow .dot{width:10px;height:10px;border-radius:3px;margin-top:3px}.brow .dash{border:1px dashed #ffb000}
.brow b{display:block;font-size:13px}.why{color:#9fb0de;font-size:12px;line-height:1.4}.brow .pts{font-weight:800;font-size:15px}
.brow.dim{opacity:.75}.amb{color:#ffd166}.two{color:#ffd166;font-weight:700;letter-spacing:0;text-transform:none}
.mult{background:#14203f;border:1px solid #2c3f73;border-radius:8px;padding:8px;margin-top:10px;font-size:12px;color:#b4c0e6}
.cmp{display:flex;gap:8px;margin-top:10px}.cmp div{flex:1;background:#14203f;border-radius:8px;padding:6px;text-align:center;font-size:11px;color:#9fb0de}.cmp b{display:block;font-size:15px;color:#e8ecff}
.note{font-size:12px;color:#b4c0e6;line-height:1.45}
.warn{background:#ffb000;color:#111;border-radius:8px;padding:6px 10px;font-size:13px;margin-bottom:10px}
.swap{background:#2b1630;border:1px solid #ff5c7a;border-radius:10px;padding:10px;margin-top:8px}
.swap .h{font-size:13px;font-weight:700;color:#ff8da1;margin-bottom:6px}
.swap .r{display:flex;align-items:center;gap:10px}
.swap .r .av{width:34px;height:34px;font-size:12px;margin:0}
.swap .gain{margin-left:auto;font-size:18px;font-weight:800;color:#38d39f}
@media(max-width:760px){
 .wrap{display:block;padding:10px}
 .p{width:84px}.xp{font-size:17px}
 .proj{margin-left:0}
 .panel{display:none;position:static;min-width:0;max-width:none;width:100%;margin:8px 0;flex-basis:100%;box-shadow:0 4px 18px rgba(0,0,0,.45)}
 .panel.open{display:block}
 .close{display:block}
}
.kit{width:52px;height:52px;display:block;margin:2px auto 2px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
.proj b.pj{display:block}.g.gx b{color:#8e9bc4}.sell-note{margin-top:6px}.cap{display:inline-block;font-size:9px;font-weight:800;color:#0b1020;background:#ffd400;border-radius:8px;padding:0 5px;margin-left:3px}.fl{color:#ffb000}
.stale{display:none}
.rep,.back{background:#2b4a9a;border:1px solid #4a6fd0;color:#fff;border-radius:8px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;margin:0 0 4px}
.back{background:none;border:none;color:#9fb0de;padding:0;margin-bottom:8px}
.srch{width:100%;background:#0f1a36;border:1px solid #2c3f73;color:#e8ecff;border-radius:8px;padding:8px 10px;font-size:14px;margin:6px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.chip{background:rgba(127,140,200,.13);border:1px solid #2c3f73;color:#b4c0e6;border-radius:14px;padding:3px 10px;font-size:12px;cursor:pointer}
.chip.on{background:#2b4a9a;color:#fff;border-color:#4a6fd0}
.rl{display:flex;align-items:center;gap:8px;padding:6px;border-radius:10px;border:1px solid transparent;cursor:pointer}
.rl:hover{background:rgba(127,140,200,.15)}
.rl.full{opacity:.4;cursor:default}.rl.full:hover{background:none}
.rl .kit{width:34px;height:34px;margin:0;flex:none}
.rl .mid{flex:1;min-width:0}.rl .mid b{font-size:13px}
.rl .fxs .opp{margin:2px 2px 0 0}
.rl .rt{text-align:right;flex:none}.rl .rt b{display:block;font-size:15px}.rl .rt span{font-size:12px;color:#9fb0de}
.rl .gn{font-size:12px;font-weight:700;color:#38d39f}
.rl .why{font-size:11px;color:#ff8da1}
.rl .pr.amb{color:#ffb000;font-weight:700}
.rlist{max-height:420px;overflow-y:auto}
.p.new{box-shadow:0 0 0 2px #4da3ff}.p.new.sel{box-shadow:0 0 0 2px #4da3ff,0 0 0 5px #ffd400}
.intag{position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:#4da3ff;color:#0b1020;font-size:9px;font-weight:800;padding:2px 7px;border-radius:9px;white-space:nowrap;max-width:96%;overflow:hidden;text-overflow:ellipsis}
.undo{display:block;margin-top:3px;font-size:10px;color:#9fb0de;text-decoration:underline;cursor:pointer}
.pbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#14203f;border:1px solid #34509a;border-radius:10px;padding:8px 10px;margin:14px 18px 0;font-size:13px}
.pill{background:#1d2b52;border-radius:12px;padding:2px 10px;font-size:12px}
.pill.amber{background:#ffb000;color:#111;font-weight:700}.pill.red{background:#ff5c7a;color:#fff;font-weight:700}
.btn{background:none;border:1px solid #34509a;border-radius:8px;padding:3px 10px;font-size:12px;color:#cfe0ff;cursor:pointer}
.btn.right{margin-left:auto}
.ft{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#9fb0de}.ft b{color:#e8ecff;min-width:10px;text-align:center}
.ft .btn{padding:0 8px;font-size:14px}
.plan{margin:0 18px 18px;background:#111a33;border:1px solid #2c3f73;border-radius:12px;padding:12px}
.plan h4{margin:0 0 8px;font-size:14px}
.cols{display:flex;gap:16px;flex-wrap:wrap}.cols>div{flex:1;min-width:240px}
.grid{display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:4px 10px;font-size:13px}
.grid .h{color:#8e9bc4;font-size:11px}
.up{color:#38d39f;font-weight:700}.dn{color:#ff5c7a;font-weight:700}
.outin{display:flex;gap:6px;align-items:center;padding:5px 0;border-bottom:1px solid #1c2747;font-size:13px;flex-wrap:wrap}
.outin .a{color:#8e9bc4}.outin .d{margin-left:auto}
.plan .cap2{font-size:12px;color:#8e9bc4;margin-top:6px}
.arr{font-size:12px;margin-left:3px}
</style></head><body>
<div class="grades" id="grades"></div>
<div id="bar"></div>
<div class="wrap"><div class="pitch" id="pitch"></div><div class="panel" id="panel"></div></div>
<div id="plan"></div>
<script>
let DATA={cards:[],grades:{},kits:{}};   // the payload, set by render()
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DEFAULT_KIT={body:'#6b7280',sleeves:'#4b5563',text:'#ffffff',pattern:'plain'};
const kitOf=c=>DATA.kits[c]||DEFAULT_KIT;
const num=(v,d=1)=>v==null?'–':Number(v).toFixed(d);
let ALL=[],starters=[],bench=[],sel=null;
let listMode=false,q='',sortKey='sug',openP=false,pendingSwap=false,lastFocus=null;   // panel state; survives a render()
function shirt(club,initials){
 const k=kitOf(club);let body=k.body,defs='',pid='k'+String(club).replace(/\W/g,'')+Math.random().toString(36).slice(2,7);
 if(k.pattern==='stripes'){const[a,b]=k.pattern_colors;defs=`<pattern id="${pid}" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="5" height="10" fill="${esc(a)}"/><rect x="5" width="5" height="10" fill="${esc(b)}"/></pattern>`;body=`url(#${pid})`}
 if(k.pattern==='hoops'){const[a,b]=k.pattern_colors;defs=`<pattern id="${pid}" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="5" fill="${esc(a)}"/><rect y="5" width="10" height="5" fill="${esc(b)}"/></pattern>`;body=`url(#${pid})`}
 const lbl=k.pattern==='plain'?`<text x="30" y="40" text-anchor="middle" font-size="12" font-weight="700" fill="${esc(k.text)}" font-family="sans-serif">${esc(initials)}</text>`:'';
 const sl=esc(k.sleeves),collar=(k.sleeves==='#C8102E'||k.sleeves==='#034694')?'#fff':sl;
 return `<svg class="kit" viewBox="0 0 60 60"><defs>${defs}</defs><path d="M14 22 L4 26 L1 14 L16 5 Z" fill="${sl}"/><path d="M46 22 L56 26 L59 14 L44 5 Z" fill="${sl}"/><path d="M16 5 Q30 13 44 5 L46 22 L46 57 L14 57 L14 22 Z" fill="${esc(body)}" stroke="rgba(0,0,0,.35)" stroke-width="1"/><path d="M24 6 Q30 11 36 6" fill="none" stroke="${collar}" stroke-width="2"/>${lbl}</svg>`}
const oppTxt=f=>`${esc(f.opp)} (${f.home?'H':'A'})`;
const fdr=f=>Math.min(5,Math.max(2,f.fdr||3));
const XP_COLOUR={green:'#38d39f',amber:'#fff',red:'#ff5c7a'};   // v1 rule: chance <= 50% is red
function card(p){const i=ALL.indexOf(p),f=p.fixtures[0],xp=p.xp;
 return `<div class="p${p===sel?' sel':''}${p.was?' new':''}${p.sell?' sell':''}" data-i="${i}" style="--club:${esc(kitOf(p.club).body==='#ffffff'?kitOf(p.club).sleeves:kitOf(p.club).body)}" onclick="pick(${i})">
 ${p.was?`<span class="intag">IN · was ${esc(p.was)}</span>`:p.sell?'<span class="selltag">↘ SELL</span>':''}
 <div class="pos">${esc(p.pos)}${p.captain?' · C':''}${p.flag?' · <span class="fl">⚠</span>':''}</div>
 ${shirt(p.club,p.initials)}
 <div class="nm">${esc(p.name)}</div>
 <div class="xp" style="color:${XP_COLOUR[p.colour]||'#fff'}">${num(xp)}<small> xP</small></div>
 ${f?`<span class="opp d${fdr(f)}">${oppTxt(f)}</span>`:'<span class="opp d3">–</span>'}
 <div class="bar" title="${p.pos==='GK'?'Clean sheet chance: how likely his team keeps a clean sheet':'DefCon chance: how likely he earns the 2 defensive-contribution points'}"><i style="width:${p.bar_pct||0}%"></i></div>
 <div class="dc">${esc(p.bar_label)} ${p.bar_pct==null?'–':p.bar_pct+'%'}</div>
 ${p.was?`<span class="undo" onclick="event.stopPropagation();undoCard(${Number(p.original_id)})">undo</span>`:''}</div>`}
function sellBlock(p){const s=p.sell;if(!s)return '';
 const hit=s.hit?` · <b>−${s.hit} hit</b>`:'';
 const inst=s.starts_instead_of?` (starts instead of ${esc(s.starts_instead_of)})`:'';
 return `<div class="swap"><div class="h">↘ Suggested sell</div><div class="r"><div style="width:40px">${shirt(s.to_club,s.initials)}</div><div><b>${esc(s.to_full_name)}</b> <span class="note">${esc(s.to_club)}${inst}</span><div class="note">extra points over the next 3 gameweeks${hit}</div></div><div class="gain">+${num(s.gain3)}</div></div><div class="note sell-note">Best single move — each suggestion is checked on its own against your current squad, so pick one rather than making all of them.</div></div>`}
const fold=s=>String(s==null?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const POS_PLURAL={GK:'goalkeepers',DEF:'defenders',MID:'midfielders',FWD:'forwards'};
const SORTS=[['sug','Suggested first'],['xp3','Pts 3 wks'],['price','Price'],['club','Club']];
function replRow(r,o,out,counts,cap){
 const full=(counts[r.club]||0)-(out.club===r.club?1:0)>=3,amb=r.price>cap+1e-9;
 const fx=(r.fixtures||[]).slice(0,3).map(f=>`<span class="opp d${fdr(f)}">${oppTxt(f)}</span>`).join('');
 const gn=o?`<div class="gn">👍 +${num(o.gain3)} pts${o.hit>0?`, −${num(o.hit,0)} hit`:''}${o.starts_instead_of?` (starts instead of ${esc(o.starts_instead_of)})`:''}</div>`:'';
 const body=`${shirt(r.club,r.initials)}<div class="mid"><b>${esc(r.name)}</b> <span class="note">${esc(r.club)}</span>${gn}<div class="fxs">${fx}</div>${full?'<div class="why">already 3 from this club</div>':''}</div><div class="rt"><b class="pr${amb?' amb':''}">£${num(r.price)}m</b><span>${num(r.xp3)} pts</span></div>`;
 return full?`<div class="rl full">${body}</div>`:`<div class="rl" data-in="${esc(r.id)}" onclick="swapIn(${Number(r.id)})">${body}</div>`}
function replRows(){
 const out=sel,inSquad=new Set(ALL.map(c=>c.id)),counts={};ALL.forEach(c=>{counts[c.club]=(counts[c.club]||0)+1});
 const cap=(DATA.bank||0)+(out.selling_price||0),needle=fold(q.trim());
 const pool=((DATA.pool||{})[out.pos]||[]).filter(r=>!inSquad.has(r.id)&&(!needle||fold(r.name+' '+r.full_name).includes(needle)));
 const opts=new Map((out.options||[]).map(o=>[o.id,o]));
 const items=pool.map(r=>({r,o:opts.get(r.id)||null}));
 const row=x=>replRow(x.r,x.o,out,counts,cap);
 if(sortKey==='sug'){
  const sug=(out.options||[]).map(o=>items.find(x=>x.r.id===o.id)).filter(Boolean);
  return (sug.length?`<div class="sec">👍 Suggested for your team</div>${sug.map(row).join('')}<div class="sec">All ${POS_PLURAL[out.pos]||'players'}</div>`:'')+items.filter(x=>!x.o).map(row).join('')}
 const key={xp3:(a,b)=>b.r.xp3-a.r.xp3,price:(a,b)=>b.r.price-a.r.price||b.r.xp3-a.r.xp3,club:(a,b)=>String(a.r.club).localeCompare(String(b.r.club))||b.r.xp3-a.r.xp3}[sortKey];
 return items.slice().sort(key).map(row).join('')}
function replPanel(){
 const p=sel,none=!(p.options||[]).length&&(DATA.bank||0)<0;
 return `<button class="close" onclick="closeP()">×</button><button class="back" onclick="backStats()">← back to stats</button>
 <h2>Replace ${esc(p.full_name)}</h2><div class="meta">${esc(p.pos)} · ${esc(p.club)} · sells for ${p.selling_price==null?'–':'£'+num(p.selling_price)+'m'}</div>
 ${DATA.error?`<div class="warn">${esc(DATA.error)}</div>`:''}
 <input class="srch" type="search" placeholder="Search by name" value="${esc(q)}" oninput="setQ(this.value)">
 <div class="chips">${SORTS.map(([k,t])=>`<span class="chip${k===sortKey?' on':''}" onclick="setSort('${k}')">${t}</span>`).join('')}</div>
 ${none?'<div class="note">No player in this position gets you back within budget</div>':''}
 <div class="rlist" id="rlist">${replRows()}</div>`}
function openReplace(){if(!sel)return;listMode=true;draw()}
function backStats(){listMode=false;draw()}
function setSort(k){sortKey=k;draw()}
function setQ(v){q=v;const el=document.getElementById('rlist');if(el)el.innerHTML=replRows();else draw()}
function swapIn(id){if(!sel)return;pendingSwap=true;send({type:'swap',out_id:sel.id,in_id:id})}
// Narrow screens: an open panel sits under the selected card's row (draw() re-appends it to .wrap).
function placePanel(){
 if(window.innerWidth>760||!openP||!sel)return;
 const el=document.querySelector('#pitch .p[data-i="'+ALL.indexOf(sel)+'"]');if(!el)return;
 const panel=document.getElementById('panel'),row=el.parentNode;row.after(panel);panel.classList.add('open')}
const gl=g=>'ABCDE'.indexOf(g);
function cmp(a,b){const x=gl(a),y=gl(b);return x<0||y<0||x===y?0:(x<y?1:-1)}   // 1: a better than b
function gradeArrow(area,g){const c=cmp(g,(DATA.base_grades||{})[area]);return c>0?'<span class="arr up">▲</span>':c<0?'<span class="arr dn">▼</span>':''}
const money=(v,sign)=>{const r=Math.round(Math.abs(v)*10)/10,neg=v<0&&r>0;return (neg?'−':sign&&r>0?'+':'')+'£'+r.toFixed(1)+'m'};
const plural=(n,w)=>n+' '+w+(n===1?'':'s');
function drawPlan(){
 const P=DATA.plan,ft=DATA.ft==null?1:DATA.ft;
 const ftc=`<span class="ft">Free transfers <button class="btn" onclick="setFt(${ft-1})" ${ft<=0?'disabled':''}>−</button><b>${esc(ft)}</b><button class="btn" onclick="setFt(${ft+1})" ${ft>=5?'disabled':''}>+</button></span>`;
 const bar=document.getElementById('bar'),sec=document.getElementById('plan');
 if(!P){bar.innerHTML=`<div class="pbar">${ftc}</div>`;sec.innerHTML='';return}
 bar.innerHTML=`<div class="pbar"><b style="font-size:12px">Your plan:</b><span class="pill">${plural(P.n_changes,'change')}</span><span class="pill">${plural(P.ft_used,'free transfer')} used</span>${P.hit>0?`<span class="pill red">−${esc(P.hit)} pt hit</span>`:''}${P.bank<0?`<span class="pill amber">£${Math.abs(P.bank).toFixed(1)}m over budget</span>`:''}${ftc}<button class="btn right" onclick="send({type:'undo_last'})">↶ Undo last</button><button class="btn" onclick="send({type:'reset'})">Reset to my team</button></div>`;
 const C=P.compare,d=(a,b)=>{const v=b-a;return `<span class="${Math.abs(v)<0.05?'':v>0?'up':'dn'}">${Math.abs(v)<0.05?'–':(v>0?'+':'−')+Math.abs(v).toFixed(1)}</span>`};
 const rows=[['Pts next 3 wks',C.pts3],['…after hits',C.pts3_after_hits]].map(([t,[a,b]])=>`<span>${t}</span><span>${num(a)}</span><span>${num(b)}</span>${d(a,b)}`).join('')
  +C.grades.map(([t,a,b])=>{const c=cmp(b,a);return `<span>${esc(t)}</span><span>${esc(a)}</span><span>${esc(b)}</span><span class="${c>0?'up':'dn'}">${c>0?'▲':'▼'}</span>`}).join('')
  +`<span>Bank</span><span>${money(C.bank[0])}</span><span>${money(C.bank[1])}</span>${C.bank[1]<0?'<span class="dn">over</span>':d(C.bank[0],C.bank[1])}`;
 const outs=P.changes.map(c=>{const m=-c.diff;return `<div class="outin"><span>${esc(c.out_name)} £${num(c.out_price)}m</span><span class="a">→</span><span>${esc(c.in_name)} £${num(c.in_price)}m</span><span class="d ${m<-0.049?'dn':m>0.049?'up':''}">${money(m,true)}</span></div>`}).join('');
 sec.innerHTML=`<div class="plan"><h4>Your plan vs your real team</h4><div class="cols"><div><div class="grid"><span class="h"></span><span class="h">Real team</span><span class="h">Plan</span><span class="h">Diff</span>${rows}</div></div><div>${outs}<div class="cap2">Make these in the FPL app. This site never changes your real team.</div></div></div></div>`}
function undoCard(id){send({type:'undo',original_id:id})}
function setFt(v){send({type:'set_ft',ft:Math.max(0,Math.min(5,Number(v)||0))})}
function breakdown(p){
 const b=p.breakdown,cmpv=p.compare||{},gk=p.pos==='GK',n1=v=>v==null?'–':num(v);
 const strip=`<div class="cmp"><div><b>${n1(p.xp)}</b>This site</div><div><b>${n1(cmpv.fpl_form)}</b>FPL's number (recent form)</div><div><b>${n1(cmpv.last5)}</b>Last 5 avg</div></div>`;
 if(!b)return `<div class="sec">Why is his xP ${n1(p.xp)}?</div><div class="note">Not enough data for a breakdown — using the simpler model.</div>${strip}`;
 const head=`<div class="sec">Why is his xP ${n1(b.total)}?${b.n_fixtures===2?' <span class="two">2 games</span>':''}</div>`;
 if(!b.n_fixtures)return head+`<div class="note">No game this gameweek</div>${strip}`;
 const pct=v=>Math.round(v*100)+'%',opp=esc(b.opp_short||'the opponent'),pl=POS_PLURAL[p.pos]||'players';
 const rows=[['s1','Playing',b.app_pts,`${pct(b.start_prob)} likely to play (${esc(Math.round(b.minutes_last5))} of the last 450 minutes)`],
  ['s2','Goals &amp; assists',b.att_pts,`${num(b.xg90,2)} xG + ${num(b.xa90,2)} xA per 90 over his last 6 games; ${opp} concede ${num(b.opp_xg_ratio)}× the average to ${pl}`]];
 if(p.pos!=='FWD')rows.push(['s3','Clean sheet',b.cs_pts,`${pct(b.cs_chance)} chance: ${p.club?esc(p.club)+' concede ':'conceding '}${num(b.own_xgc_pm)} xG a game, ${opp}'s attack is ${num(b.opp_atk_ratio)}× average`]);
 if(!gk)rows.push(['s4','DefCon',b.defcon_pts,`${pct(b.defcon_chance)} chance of ${p.pos==='DEF'?10:12}+ defensive actions: hit it in ${esc(b.defcon_hits)} of his last ${esc(b.defcon_apps)}`]);
 const tot=b.total>0?b.total:0;
 return head+`<div class="bonuswarn">⚠ Bonus points not included — top attackers often earn 1–2 more a game than this shows.</div>
 <div class="stack">${rows.map(r=>`<div class="${r[0]}" style="width:${tot?(Math.max(0,r[2])/tot*100).toFixed(1):0}%"></div>`).join('')}</div>
 ${rows.map(r=>`<div class="brow"><div class="dot ${r[0]}"></div><div><b>${r[1]}</b><span class="why">${r[3]}</span></div><div class="pts">${num(r[2])}</div></div>`).join('')}
 <div class="brow dim"><div class="dot dash"></div><div><b class="amb">Bonus points</b><span class="why">Not estimated by this model yet</span></div><div class="pts amb">not counted</div></div>
 <div class="mult">Also not counted: cards, own goals.</div>${strip}`}
function draw(){
 document.querySelector('.wrap').appendChild(document.getElementById('panel'));
 document.getElementById('grades').innerHTML=Object.entries(DATA.grades).map(([a,g])=>`<div class="g g${esc(g)}"><b>${esc(g)}${gradeArrow(a,g)}</b><span>${esc(a)}</span></div>`).join('')+`<div class="proj"><b>${num(DATA.projected)} pts</b><span>projected · average manager ${num(DATA.average)}</span></div>`;
 drawPlan();
 const by=pos=>starters.filter(p=>p.pos===pos).map(card).join('');
 document.getElementById('pitch').innerHTML=['FWD','MID','DEF','GK'].map(x=>`<div class="row">${by(x)}</div>`).join('')+`<div class="bench"><div class="lbl">BENCH</div><div class="row">${bench.map(card).join('')}</div></div>`;
 const panel=document.getElementById('panel');
 if(!sel){panel.innerHTML='<div class="note">No players to show.</div>';placePanel();fit();return}
 if(listMode){panel.innerHTML=replPanel();placePanel();fit();return}
 const p=sel,gk=p.pos==='GK',l6=p.last6||{};
 const sb=(t,v,m,s)=>`<div class="sb"><span class="t">${t}</span><span class="b"><i style="width:${v==null?0:Math.min(100,v/m*100)}%"></i></span><span class="v">${s}</span></div>`;
 const chanceLbl=gk?'Clean sheet chance':'DefCon chance';
 const bdHtml=breakdown(p);
 panel.innerHTML=`<button class="close" onclick="closeP()">×</button>
 <h2>${esc(p.full_name)}${p.captain?' (C)':''}</h2><div class="meta">${esc(p.pos)} · ${esc(p.club)} · ${p.price==null?'–':'£'+num(p.price)+'m'} · ${p.owned==null?'–':esc(p.owned)+'% owned'}</div>
 ${DATA.error?`<div class="warn">${esc(DATA.error)}</div>`:''}
 ${p.flag?`<div class="warn">⚠ ${esc(p.flag)}</div>`:''}
 <button class="rep" onclick="openReplace()">Replace</button>
 ${sellBlock(p)}
 <div class="kp" style="margin-top:12px"><div><b>${num(p.xp)}</b><span>xP next GW</span></div><div><b>${num(p.xp3)}</b><span>xP next 3</span></div><div><b>${p.bar_pct==null?'–':p.bar_pct+'%'}</b><span>${chanceLbl}</span></div></div>
 ${bdHtml}
 <div class="sec">Next fixtures</div><div class="fx">${p.fixtures.map(f=>`<div class="d${fdr(f)}">${oppTxt(f)}</div>`).join('')||'<span class="note">No fixtures scheduled</span>'}</div>
 <div class="sec">Last 6 gameweeks</div>${sb('Form (pts/gm)',l6.form,10,num(l6.form))}${sb('xG',l6.xg,7,num(l6.xg))}${sb('xA',l6.xa,7,num(l6.xa))}${gk?'':sb('DefCon hits',l6.defcon_pct,100,l6.defcon_apps?`${l6.defcon_hits} of ${l6.defcon_apps}`:'–')}
 <div class="sec">Opponent weakness</div><div class="note">${p.weakness?esc(p.weakness)+'.':'Not enough data yet.'}</div>
 <div class="sec">Set pieces</div><div class="note">${p.set_pieces?esc(p.set_pieces):'No set-piece duties'}</div>`;
 placePanel();fit()}
function pick(i){if(sel&&ALL[i]&&ALL[i].id!==sel.id)q='';sel=ALL[i];listMode=false;openP=true;draw();
 if(window.innerWidth<=760)document.getElementById('panel').scrollIntoView({block:'nearest'})}
function closeP(){openP=false;document.getElementById('panel').classList.remove('open');fit()}
// The one draw entry: Streamlit calls it with each new payload (the tests call it directly).
// The selected card survives a redraw; focus_id (the player just swapped in) takes over.
function render(payload){DATA=payload;ALL=DATA.cards;
 starters=ALL.filter(p=>p.starter);bench=ALL.filter(p=>!p.starter);
 const keep=sel&&ALL.find(p=>p.id===sel.id);
 const fresh=DATA.focus_id!=null&&(pendingSwap||DATA.focus_id!==lastFocus);
 const foc=fresh?ALL.find(p=>p.id===DATA.focus_id):null;
 lastFocus=DATA.focus_id;pendingSwap=false;
 const before=sel&&sel.id;
 sel=foc||keep||ALL.find(p=>p.sell)||ALL.find(p=>p.starter)||ALL[0];
 if(foc){listMode=false;q=''}else if(!sel||sel.id!==before)listMode=false;
 counter=Math.max(counter,DATA.n||0);
 draw()}
// ---- bridge to Streamlit (declared component, apiVersion 1). Guarded so the page script
// also runs outside a frame (the node test harnesses).
let counter=0;   // numbers each action; the app ignores a number it has already seen
const inFrame=()=>typeof window!=='undefined'&&window.parent&&window.parent!==window;
function post(type,extra){if(inFrame())window.parent.postMessage(Object.assign({isStreamlitMessage:true,type},extra),'*')}
function fit(){if(inFrame())post('streamlit:setFrameHeight',{height:document.body.scrollHeight})}
function send(action){post('streamlit:setComponentValue',{value:Object.assign({},action,{n:++counter}),dataType:'json'})}
if(typeof window!=='undefined'&&window.addEventListener){
 window.addEventListener('message',e=>{if(e.data&&e.data.type==='streamlit:render')render(e.data.args.payload)});
 post('streamlit:componentReady',{apiVersion:1})}
</script></body></html>
